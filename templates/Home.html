<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Housing Predictor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;scroll-behavior:smooth;}

body{
    background:#050510;
    color:white;
    overflow-x:hidden;
    perspective:1000px;
}

/* ===== ULTRA PARALLAX SYSTEM ===== */
.parallax{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-20;
}

.layer{
    position:absolute;
    width:200%;
    height:200%;
    transform-style:preserve-3d;
}

/* DEEP SPACE GRADIENT */
.layer.bg{
    background: radial-gradient(circle at 20% 30%, #1a1a40, transparent 60%),
                radial-gradient(circle at 80% 70%, #001f3f, transparent 60%),
                linear-gradient(120deg,#050510,#0a0a2a,#050510);
}

/* NEON WAVES */
.layer.waves{
    background: radial-gradient(circle at 50% 50%, #00f5ff33, transparent 70%);
    filter: blur(40px);
    animation: waveMove 20s ease-in-out infinite alternate;
}

@keyframes waveMove{
    from{transform:translateY(0px) scale(1);} 
    to{transform:translateY(-100px) scale(1.2);} 
}

/* GLOW BLOBS */
.layer.blob1{
    background: radial-gradient(circle, #ff00ccaa, transparent 60%);
    top:10%;left:20%;
}

.layer.blob2{
    background: radial-gradient(circle, #00f5ffaa, transparent 60%);
    bottom:10%;right:20%;
}

/* GRID */
.layer.grid{
    background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:60px 60px;
}

/* PARTICLE DOTS */
.layer.particles{
    background-image: radial-gradient(circle, white 1px, transparent 1px);
    background-size:20px 20px;
    opacity:0.3;
}

/* ===== NAVBAR ===== */
.navbar{
    position:fixed;
    top:0;
    width:100%;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    transform-style:preserve-3d;
}

.hero h2{
    font-size:50px;
    background:linear-gradient(90deg,#ff00cc,#00f5ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    transform:translateZ(50px);
}

.hero p{opacity:0.7;transform:translateZ(30px);}

/* CARD */
.container{
    margin:80px auto;
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.08);
    padding:30px;
    border-radius:20px;
    width:420px;
    transform:translateZ(40px);
    transition:0.3s;
}

.container:hover{
    transform:rotateX(5deg) rotateY(5deg) scale(1.02);
}

.input-group{margin:10px 0;}

.input-group input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.25);
    color:white;
    font-size:14px;
}

.input-group input::placeholder{
    color:#ffffffcc;
    opacity:1;
}

button{
    width:100%;padding:14px;margin-top:15px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#ff00cc,#00f5ff);
    cursor:pointer;font-weight:600;
}

.result{margin-top:15px;text-align:center;display:none;}

</style>
</head>

<body>

<div class="parallax">
    <div class="layer bg"></div>
    <div class="layer waves"></div>
    <div class="layer blob1"></div>
    <div class="layer blob2"></div>
    <div class="layer grid"></div>
    <div class="layer particles"></div>
</div>

<div class="navbar">
    <h1>🏠 Housing AI</h1>
    <span>ML Powered</span>
</div>

<section class="hero">
    <h2>Predict Housing Prices</h2>
    <p>Next-gen AI powered prediction system</p>
</section>

<div class="container">

    <div class="input-group"><input type="number" id="MedInc" placeholder="Median Income"></div>
    <div class="input-group"><input type="number" id="HouseAge" placeholder="House Age"></div>
    <div class="input-group"><input type="number" id="AveRooms" placeholder="Rooms"></div>
    <div class="input-group"><input type="number" id="AveBedrms" placeholder="Bedrooms"></div>
    <div class="input-group"><input type="number" id="Population" placeholder="Population"></div>
    <div class="input-group"><input type="number" id="AveOccup" placeholder="Occupancy"></div>
    <div class="input-group"><input type="number" id="Latitude" placeholder="Latitude"></div>
    <div class="input-group"><input type="number" id="Longitude" placeholder="Longitude"></div>

    <button onclick="predict()">⚡ Predict</button>

    <div class="result" id="result"></div>
</div>

<script>
// STRONG 3D PARALLAX
window.addEventListener("mousemove", (e) => {
    const x = (window.innerWidth/2 - e.clientX) / 25;
    const y = (window.innerHeight/2 - e.clientY) / 25;

    document.querySelectorAll(".layer").forEach((layer, i) => {
        const depth = (i+1)*10;
        layer.style.transform = `translate(${x/depth}px, ${y/depth}px)`;
    });

    // tilt card
    const card = document.querySelector(".container");
    card.style.transform = `rotateX(${y/5}deg) rotateY(${-x/5}deg)`;
});

async function predict(){
    // const values = ['MedInc','HouseAge','AveRooms','AveBedrms','Population','AveOccup','Latitude','Longitude']
    //     .map(id => parseFloat(document.getElementById(id).value));

    const data = {
    MedInc: parseFloat(document.getElementById('MedInc').value),
    HouseAge: parseFloat(document.getElementById('HouseAge').value),
    AveRooms: parseFloat(document.getElementById('AveRooms').value),
    AveBedrms: parseFloat(document.getElementById('AveBedrms').value),
    Population: parseFloat(document.getElementById('Population').value),
    AveOccup: parseFloat(document.getElementById('AveOccup').value),
    Latitude: parseFloat(document.getElementById('Latitude').value),
    Longitude: parseFloat(document.getElementById('Longitude').value)
};
// since we need data in json so we need to convert it into json format not the list format 
 if (Object.values(data).some(v => isNaN(v))) {
        alert("Please fill all fields correctly");
        return;
    }

    const response = await fetch('/predict',{
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ data: data})
    });

    const result = await response.json();

    const box = document.getElementById('result');
    box.style.display='block';
    box.innerHTML = `💰 $${result.prediction.toLocaleString(undefined, {maximumFractionDigits:0})}`;
}
</script>

</body>
</html>
